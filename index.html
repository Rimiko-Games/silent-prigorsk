<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Тихий Пригорск</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: investigator's desk. Sticky clock bar on top, one working surface in the middle, four drawers (tabs) at the bottom */
:root{
  --desk:#1c201e; --desk2:#252a27; --line:#39413b; --text:#e6e3da; --dim:#9aa197;
  --paper:#e8ddc1; --paper2:#d9cca9; --ink:#2a251b; --ink2:#6b604a;
  --stamp:#b8362e; --amber:#dba544; --crt:#0b140f; --crtfg:#8fe39a; --crtdim:#4f8a5a; --water:#7fa6bf;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'PT Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'PT Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk) url(img/t_wood.webp) repeat;background-size:420px;color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--desk);border-bottom:1px solid var(--line);padding-block:10px;display:grid;gap:8px}
.clock{display:flex;align-items:center;gap:12px}
.time{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.daybox{display:grid;line-height:1.2}
.daybox b{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.daybox span{font-size:12px;color:var(--dim)}
.where{margin-left:auto;text-align:right;font-size:12px;color:var(--dim);line-height:1.3;min-width:0}
.where b{display:block;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deadline{height:4px;background:var(--desk2);border-radius:2px;overflow:hidden}
.deadline i{display:block;height:100%;background:var(--amber);transition:width .4s}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--desk2);border:1px dashed #5b5236;border-radius:4px;padding:8px 10px;font-size:14px;color:#e9d9a8}
.hint b{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.1em;color:var(--amber);padding-top:2px}
.hint button{margin-left:auto;background:none;border:none;color:var(--dim);font-size:18px;line-height:1;padding:0 2px}

/* sections */
.view{padding-block:18px 0;display:grid;gap:16px;animation:in .3s ease both}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:22px}
h3{font-size:15px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.muted{color:var(--dim);font-size:14px}

/* folder */
.folder{background:var(--paper);color:var(--ink);border-radius:2px 10px 4px 4px;padding:18px 16px 20px;position:relative;box-shadow:0 2px 0 var(--paper2),0 10px 30px rgba(0,0,0,.35)}
.folder::before{content:"";position:absolute;top:-14px;left:0;width:42%;height:16px;background:var(--paper);border-radius:6px 10px 0 0}
.folder .no{font-family:var(--mono);font-size:12px;color:var(--ink2);letter-spacing:.06em}
.folder h2{color:var(--ink);font-size:26px;margin:2px 0 6px}
.stampmark{position:absolute;top:16px;right:14px;font-family:var(--display);font-size:13px;letter-spacing:.14em;color:var(--stamp);border:2px solid var(--stamp);padding:2px 8px;transform:rotate(6deg);opacity:.85}
.fsec{margin-top:16px;display:grid;gap:8px}
.fsec h4{margin:0;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid #bfb08a;padding-bottom:4px}
.clue{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.4}
.clue .k{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:2px 5px;border-radius:2px;background:var(--ink);color:var(--paper);margin-top:2px;white-space:nowrap}
.clue .k.lab{background:#2f4f6a}.clue .k.wit{background:#5a4a2a}.clue .k.base{background:#2d5a3a}.clue .k.find{background:var(--stamp)}
.clue.new{animation:glow 1.6s ease}
.ev{display:flex;gap:10px;flex-wrap:wrap}
.evc{flex:1 1 140px;background:#f2ead6;border:1px solid #c7b88f;border-radius:3px;padding:8px 10px;font-size:14px}
.evc b{display:block;font-family:var(--display);font-weight:600;font-size:15px}
.evc small{color:var(--ink2)}
.accuse{margin-top:18px;width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:3px;padding:14px;font-family:var(--display);font-size:18px;letter-spacing:.08em;text-transform:uppercase}

/* buttons & cards */
.card{background:var(--desk2);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px}
.card h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#2c322e;border:1px solid var(--line);border-radius:5px;padding:12px 14px;min-height:52px}
.act:active{transform:scale(.985)}
.act .t{flex:1;min-width:0}
.act .c{font-family:var(--mono);font-size:12px;color:var(--amber);white-space:nowrap}
.act.dis{opacity:.45;cursor:not-allowed}
.act small{display:block;font-size:12px;color:var(--dim)}
.primary{background:var(--amber);color:#1c1a12;border:none;border-radius:5px;padding:14px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;width:100%;min-height:52px}
.scene{margin:0;aspect-ratio:400/220;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#111}
.scene svg{display:block;width:100%;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:10px;background:#33392f;color:var(--dim)}
.pill.ok{background:#22422c;color:#9fe0a8}.pill.wait{background:#4a3c1c;color:#f0cf7a}

/* office */
.office{margin:0;border-radius:6px;overflow:hidden;border:1px solid var(--line);aspect-ratio:400/260;max-width:100%;background:#2f3b35}
.office svg{display:block;width:100%;height:100%}
.hot{cursor:pointer;transition:filter .15s}
.hot:hover,.hot:active{filter:brightness(1.18) drop-shadow(0 0 4px rgba(219,165,68,.6))}
.hot.glow{animation:hot 1.6s ease-in-out infinite}
.olbl{font-family:'PT Mono',monospace;font-size:7px;fill:#e8ddc1;letter-spacing:.08em;paint-order:stroke;stroke:#1c201e;stroke-width:2.4px;pointer-events:none}
.blinkt{animation:blink 1s steps(2) infinite}
@keyframes hot{0%,100%{filter:none}50%{filter:brightness(1.25) drop-shadow(0 0 6px rgba(219,165,68,.95))}}
/* photo office */
.office{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);aspect-ratio:2576/1438;max-width:100%;background:#1a1a17}
.office>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;inset:0;background:#0b0d14;pointer-events:none;transition:opacity .6s}
.lampglow{position:absolute;left:36%;top:18%;width:44%;height:62%;background:radial-gradient(closest-side,rgba(255,214,140,.22),transparent);pointer-events:none;mix-blend-mode:screen}
.oclock{position:absolute;left:2%;top:90%;font-family:var(--mono);font-size:clamp(8px,1.8vw,11px);background:rgba(0,0,0,.6);color:#e8ddc1;padding:1px 4px;border-radius:2px;pointer-events:none}
.hs{position:absolute;background:transparent;border:1.5px solid transparent;border-radius:6px;padding:0;transition:border-color .15s,background .15s}
.hs:hover,.hs:focus-visible{border-color:rgba(219,165,68,.8);background:rgba(219,165,68,.1)}
.hs:active{background:rgba(219,165,68,.2)}
.hs.glow{animation:hsg 1.5s ease-in-out infinite}
.hl{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-family:var(--mono);font-size:clamp(8px,1.9vw,11px);white-space:nowrap;color:#f2e6c8;background:rgba(10,12,10,.62);padding:1px 5px;border-radius:3px;pointer-events:none;letter-spacing:.03em}
.hb{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:var(--stamp);color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center}

.hs.done{opacity:.5}
@keyframes hsg{0%,100%{border-color:rgba(219,165,68,.2);box-shadow:none}50%{border-color:rgba(219,165,68,1);box-shadow:0 0 14px rgba(219,165,68,.6),inset 0 0 14px rgba(219,165,68,.25)}}
.scene img,.face img{display:block;width:100%;height:100%;object-fit:cover}
.scene{aspect-ratio:2576/1438}
.face{width:96px;height:128px}
.item{display:grid;place-items:center;background:radial-gradient(circle,#3a403b,#232825);border-radius:4px;padding:10px;min-height:120px}
.item img{max-height:150px;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.evimg{height:70px;display:grid;place-items:center;margin-bottom:6px;background:#d6c9a6;border-radius:2px}
.evimg img{max-height:62px;max-width:92%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.av{width:36px;height:46px;border-radius:4px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
/* reveal */
#reveal .rv{position:fixed;inset:0;z-index:40;background:rgba(4,5,4,.86);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));animation:in .25s ease}
.rv-card{width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:4px;padding:18px 16px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}

.rv-card p{margin:0;font-size:16px;line-height:1.45}
.rv-stamp{justify-self:start;font-family:var(--display);font-size:13px;letter-spacing:.16em;color:var(--stamp);border:2px solid var(--stamp);padding:2px 8px;transform:rotate(-3deg)}
.rv-img{background:radial-gradient(circle,#4a4f48,#22261f);border-radius:3px;display:grid;place-items:center;padding:14px;min-height:200px}
.rv-img img{max-width:100%;max-height:46vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.rv-doc{background:#efe6cf;border:1px solid #c7b88f;border-radius:3px;display:grid;place-items:center;padding:14px;min-height:150px}
.rv-paper{font-family:var(--mono);font-size:15px;line-height:1.55}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
button.clue{width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed #cbbd96;padding:6px 0;color:inherit;grid-template-columns:auto 1fr auto}
.cv{color:var(--ink2);font-size:18px;line-height:1}
.evc{cursor:pointer}
/* title */
.title{position:fixed;inset:0;z-index:50;background:#0b0c0b;display:grid;align-items:end}
.title>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 30%}
.tshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,12,0) 35%,rgba(6,8,12,.9) 75%)}
.tin{position:relative;max-width:560px;width:100%;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:in .8s ease}
.title h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,13vw,72px);line-height:.95;text-transform:uppercase;letter-spacing:.02em;color:#efe6cf}
.tk{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--amber)}
.title p{margin:0;color:#cfc6b0;font-size:17px;max-width:34ch}
.ghost{background:none;border:1px solid #5d5a4c;color:#e6e3da;border-radius:5px;padding:12px;font-size:15px}
.pill.due{display:grid;justify-items:center;gap:1px;line-height:1.15;padding:4px 10px;border-radius:8px;font-weight:400}.pill.due b{font-weight:400}.pill.due small{font-size:10px;opacity:.75;letter-spacing:.08em}
#radios .rv{position:fixed;inset:0;z-index:45;background:rgba(4,5,4,.86);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));animation:in .25s ease}
.rhead{display:flex;gap:10px;align-items:center;color:var(--amber);font-family:var(--mono);font-size:12px;letter-spacing:.12em}.rhead svg{flex:none}
.rsay{font-size:18px!important;line-height:1.45;color:#efe6cf}
.act.next{border-color:#6b5a2c;background:rgba(40,36,24,.85)}.act.next small{color:#f0d68a;font-size:14px;line-height:1.4;margin-top:4px}

.hq{display:block;font-family:var(--display);font-weight:600;font-size:13px;line-height:1.15;letter-spacing:.05em;text-transform:uppercase;color:#1c1408;background:#e8862a;border-radius:8px;padding:6px 12px;white-space:nowrap;text-align:center;animation:hqpulse 1.6s ease-in-out infinite}

.nav button{position:relative}.youhere{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--amber);color:#1c1a12;border-radius:6px;padding:1px 5px;z-index:2}

.daybox b{white-space:nowrap}
.locdesc{font-size:17px!important;line-height:1.45;color:#c4c6bc}
.view h2{font-size:26px}
.act{font-size:17px}.act small{font-size:14px!important;line-height:1.35;margin-top:2px}.act .c{font-size:13px}
.hint b{display:grid;line-height:1.1}.hint b small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:2px}

.hint button:active{background:rgba(255,255,255,.08)!important}
.hlbl{flex:none;margin-top:1px}
/* small-text bump */
.bhead .tk{font-size:13px!important}.bhead .who span,.who span,.person .who span{font-size:15px!important}
.muted{font-size:15px}.daybox span{font-size:13px}.msg span{font-size:13px}.msg b{font-size:16px}

.tstrip .ava{grid-row:1/3;width:40px;height:50px}.tstrip b{font-family:var(--display);font-size:17px;line-height:1.15}.tstrip span:last-child{font-size:13px;color:var(--dim);line-height:1.2}

 dlg:{
  tkachuk:{greet:'Ой, вы из полиции? Про Петю? Горе-то какое, я ж его и нашла…',q:[

   {id:'b',q:'Видели кого-нибудь у дома?',a:'Людей не видел. А машина стояла, белая «Нива». Номер не разглядел, темно.',clue:'bu2'},
   {id:'c',q:'Ласточкина в тот вечер видели?',cond:()=>has('tk1'),a:'Гришку? Нет. Он по вечерам в «Колосе» сидит, это вся деревня знает.',pin:'bar'},
   {id:'d',q:'У Сомова были враги?',a:'Врагов не было. Должники были. Пётр в долг давал под проценты, полдеревни ему должна.',clue:'bu3'}]},

 hint:()=>{if(!S.lab.knife)return 'Начните с лаборатории: нажмите на коробку «Вещдоки» и отправьте нож на экспертизу.';
  if(!has('notebook')&&S.loc!=='scene')return 'Пока лаборатория работает, поезжайте на место преступления. Кнопка «Карта».';
  if(!has('notebook'))return 'Войдите в дом и осмотрите кухню. Жертва могла что-то записывать: проверьте ящик стола.';
  if(!S.done.scene0)return 'Обойдите соседей: кто-то мог что-то видеть или слышать.';
  if(!has('tk1')&&!has('bu1'))return 'Опросите соседей с Речной, 5 и Речной, 9.';
  if(has('tk1')&&!S.found.includes('lastochkin'))return 'Соседка назвала Ласточкина. Найдите его в базе: компьютер на столе.';
  if(has('bu2')&&!has('niva'))return 'Белая «Нива» у дома Сомова. У кого из фигурантов такая машина? Проверяйте в базе фамилии, которые всплывали в деле.';
  if(!S.found.includes('melnik'))return 'В тетради должник Мельник. Найдите его в базе.';
  if(!has('match')&&!has('jacketlab'))return 'Сверьте показания с временем смерти. Кто врёт? Вызовите подозреваемого и снимите отпечатки.';
  if(!has('jacketlab'))return S.searched?'Отправьте куртку Мельника на экспертизу: коробка «Вещдоки».':(S.warrant?'Обыщите дом Мельника по ордеру: Лесная, 14.':'Мельник не признаётся, а одного ножа суду мало. Остаётся одно: обыскать его дом. Позвоните прокурору Ветровой с рабочего телефона и запросите ордер на обыск.');
  return 'Дело готово. Папка «Дело» → «Передать дело в суд».'},
 charge:sel=>{const bad=sel.filter(x=>x!=='melnik');
  if(bad.length)return {res:'lose',text:bad.map(x=>P(x).fio).join(', ')+': суд оправдал. Против этих людей нет ни одной прямой улики.\n'+(bad.includes('lastochkin')?'Бармен подтвердил алиби Ласточкина, отпечатки на ноже чужие. ':'')+'Настоящий убийца остался на свободе.'};
  const soft=['notebook','ra2','search','bu1'].filter(has).length+(has('niva')&&has('bu2')?1:0);
  if(has('match')&&has('jacketlab'))return {res:'win',text:'Мельник В. признан виновным в убийстве Сомова П. Вину не признал, но нож с его отпечатками и кровь Сомова на его куртке не оставили защите шансов. Версия о краже ножа развалилась.\nПриговор: 9 лет колонии строгого режима. Блестящая работа, следователь.'};
  if(has('jacketlab'))return {res:'win',text:'Мельник В. признан виновным. Адвокат пытался развалить дело, но кровь Сомова на куртке подсудимого решила исход.\nПриговор: 8 лет колонии.'};
  if(has('match'))return {res:'return',text:'Отпечатки Мельника на ноже есть, но сам он вину отрицает: нож, мол, украли из сарая. При хорошей защите адвоката суд счёл, что одного ножа мало: нужно доказать, что Мельник был в доме той ночью. Суд вернул дело на доследование. Вы потеряли день.'};
  if(soft>=3)return {res:'win',text:'Мельник В. признан виновным по совокупности косвенных улик. Повезло: судья был строгий.\nВ следующий раз добудьте прямые доказательства.'};
  return {res:'return',text:'Обвинение против Мельника В. основано на догадках. Улик недостаточно. Дело возвращено на доследование. Вы потеряли день.'}},

 if(c&&c.leave){const h=S.t%24,rem=Math.max(0,22-h),hh=Math.floor(rem),mm=Math.round((rem-hh)*60),last=day()>=CS.days;

 const rs=mm?`${hh} ч ${mm} мин`:`${hh} ${pl(hh)}`;

 if(c&&c.daycard){const k=c.daycard;return `<div class="rv"><div class="rv-card"><div class="rv-stamp">ДЕНЬ ${k.d} ИЗ ${CS.days} · ${DATE(k.d)}</div><h2>08:00. Вы снова в отделе</h2>${S.flags.pnote===k.d?'<p>Связисты починили городскую линию. Теперь людей можно вызывать звонком: придут через 2 часа.</p>':''}<button class="primary" data-a="rvok">OK</button></div></div>`}if(typeof c==='string'&&c.startsWith('exam:'))c={exam:c.slice(5)};

 const [type,id]=k.split(':');
 if(type==='q'){const q=CS.dlg[who].q.find(x=>x.id===id);asked[(room?'r':'')+id]=true;advance(.25);if(S.over)return render();
  const a=room&&q.ra?q.ra:q.a;d.log.push({q:q.q,a});arr(room&&q.rclue?q.rclue:q.clue).forEach(addClue);arr(q.pin).forEach(pin);arr(q.found).forEach(found);render();return}
 if(type==='press'){const e=CS.press[who][id];S.presented[who+':'+id]=true;advance(.25);if(S.over)return render();d.log.push({q:e.l.replace('Предъявить: ','Вот: '),a:e.a});arr(e.give).forEach(addClue);arr(e.pin).forEach(pin);arr(e.found).forEach(found);
  const cf=CS.confess&&CS.confess[who];if(cf&&!has(cf.clue)&&cf.check(who)){d.log.push({a:cf.text});addClue(cf.clue);d.done=true}
  if(CS.lawyer&&CS.lawyer[who]===id){S.flags['law_'+who]=1;d.done=true;d.log.push({a:'<i>Скрещивает руки на груди и смотрит в стену. Дальше разговора не будет.</i>'})}render();return}}

 if(r.res==='return'){S.t=(Math.floor(S.t/24)+1)*24+8;S.loc='otdel';S.arrived=[];events();mail('Районный суд','Дело возвращено',r.text);toast('Суд вернул дело на доследование');UI.modal=null;if(day()>CS.days){S.over='timeout';UI.modal='end'}render();return}

 case 'detgo':{UI.reveal.shift();const ok=CS.detain&&CS.detain[id]&&CS.detain[id]();if(!ok){note('Прокурор Ветрова по телефону: «Курейко, на каком основании? Подозрения не доказательства. Задержание не санкционирую». Нужны улики против этого человека.');render();break}const m=S.smeta[id]=S.smeta[id]||{};m.det=S.t+24;m.done=true;if(S.dlg)S.dlg.log.push({a:'<i>'+(fem(id)?'Задержана':'Задержан')+' до '+WHEN(S.t+24)+', '+fmt(S.t+24)+'. Конвой уводит в камеру.</i>'});toast(short(id)+': задержан(а) на 24 часа');render();break}
 case 'hqask':UI.reveal.unshift({hq:1});render();break;
 case 'hqgo':UI.reveal.shift();go('otdel');break;
 case 'howcall':note('<b>Как вызвать человека на допрос</b><br><br>1. Найдите его: в показаниях, в базе (компьютер в кабинете) или на месте.<br>2. Вызовите одним из способов:<br>· повестка лично, у его двери: явка завтра в 10:00<br>· повестка через базу: явка завтра в 10:00<br>· звонок с рабочего телефона: придёт через 2 часа<br><br>Когда человек придёт, дежурный сообщит вам. Ждёт он 5 часов, не позже 22:00.');break;
 case 'nok':NQ.shift();drawNote();render();break;
 case 'hoff':NQ.shift();UI.hintOff=true;drawNote();render();break;
 case 'hint':UI.hintOff=false;S.flags.lastHint=null;render();break;

 case 'rvclose':UI.view=null;render();break;

 case 'pin':case 'go':go(id);break;
 case 'inside':UI.inside=!UI.inside;render();break;
 case 'spot':{const sc=curScene(),h=sc.hot[+el.dataset.i];if(h.clue&&!has(h.clue)){advance(h.t||.5);if(S.over)return render();addClue(h.clue);arr(h.also).forEach(addClue);if(h.toast)toast(h.toast)}else if(h.text)note(h.text,+el.dataset.i);else toast('Уже осмотрено.');render();break}
 case 'lact':{const i=+el.dataset.i,ac=CS.locs[S.loc].actions[i];if(S.done[S.loc+i]){if(ac.go)setTab(ac.go);return}advance(ac.t);if(S.over)return render();S.done[S.loc+i]=true;ac.run();render();break}
 case 'lab':if(S.lab[id])return;advance(.5);S.lab[id]={due:S.t+CS.items[id].lab,done:false};toast('Отправлено. Результат к '+fmt(S.lab[id].due));render();break;
 case 'labbox':UI.modal='labm';render();break;
 case 'door':UI.modal=null;setTab('calls');break;
 case 'phone':UI.phoneMsg=null;UI.call=null;UI.modal='phone';render();break;
 case 'dial':startCall(el.dataset.k);break;
 case 'csay':{const c=UI.call;if(!c)break;if(el.dataset.v==='wrong'){c.q='Извините, ошиблись номером.';c.a='<i>(гудки)</i>';c.st='end';render();break}const r=dial(c.k);c.q=r.q;c.a=r.a;c.st='end';render();break}
 case 'hang':UI.call=null;render();break;
 case 'base':UI.modal='base';render();setTimeout(()=>{const i=document.getElementById('bq');if(i&&!S.base.rec)i.focus()},50);break;
 case 'brec':S.base.rec=id;found(id);CS.onRec&&CS.onRec(id);render();break;
 case 'bback':S.base.rec=null;render();break;
 case 'bpin':pin(P(S.base.rec).loc);render();break;
 case 'bcmp':{const c=P(S.base.rec).cmp;if(!has(c)){addClue(c,true);UI.reveal.push(c)}render();break}
 case 'letter':summon(S.base.rec,(Math.floor(S.t/24)+1)*24+10,'повестка через горотдел');toast('Повестка отправлена. Явка завтра в 10:00');render();break;
 case 'call':{const id=S.base.rec;UI.modal='phone';UI.call=null;startCall('call:'+id);break}
 case 'knock':{const D=CS.dlg[id];S.dlg={who:id,mode:'door',log:[{a:D?D.greet:'Здравствуйте.'}]};(S.talks=S.talks||[]).push({id,mode:'door',t:S.t,loc:S.loc,log:S.dlg.log});found(id);UI.modal='talk';render();break}
 case 'room':if(S.smeta[id])S.smeta[id].talked=true;S.dlg={who:id,mode:'room',done:!!S.flags['law_'+id],log:[{a:'<i>'+(S.flags['law_'+id]?short(id)+' молчит и требует адвоката. ':'')+((S.smeta[id]||{}).det?'Конвой приводит '+short(id)+' из камеры.':short(id)+' садится напротив.')+'</i>'}]};(S.talks=S.talks||[]).push({id,mode:'room',t:S.t,loc:'otdel',log:S.dlg.log});UI.modal='talk';render();break;
 case 'say':say(el.dataset.k);break;
 case 'search':{const w=CS.warrant;advance(w.h);if(S.over)return render();S.searched=true;addClue(w.clue);toast(w.toast);render();break}
 case 'wait':anim('wait','Ждём…',1,550,()=>{advance(1);render()});break;

 case 'endday':UI.reveal.unshift({leave:1});render();break;
 case 'gohome':{UI.reveal.shift();render();const h=22-hour(),full=h+10;anim('night',(k,t)=>{const x=t%24;return x<22&&x>=8&&k<.5?'Едем домой…':x>=22||x<5?'Ночь…':'Утро'},full,1200,()=>{advance(h);UI.reveal=UI.reveal.filter(r=>!(r.night&&!r.night.left.length));render()});break}
 case 'mail':{const m=S.mail[+el.dataset.i];const ex=m.exam&&!m.ap;readMail(m);UI.modal=ex?null:{doc:+el.dataset.i};render();break}
 case 'accuse':UI.sel=[];UI.modal='accuse';render();break;
 case 'pick':UI.sel=UI.sel.includes(id)?UI.sel.filter(x=>x!==id):UI.sel.concat(id);render();break;
 case 'court':if(UI.sel.length)court();break;
 case 'restart':startCase(CS.id);break;
 case 'next':startCase(CS.next);break;
 case 'lamp':UI.lampOff=!UI.lampOff;render();break;
 case 'tea':toast(['Чай давно остыл.','Подстаканник ещё с советских времён.','Сахар кончился.'][Math.floor(Math.random()*3)]);break;
 case 'clock':toast('На часах '+fmt(S.t)+'. Смена до 22:00.');break;

  const st=n=>{const k=Math.min(1,(n-t0)/D);pr.querySelector('i').style.width=(k*100)+'%';pr.querySelector('b').textContent=Math.round(k*100)+'%';if(k<1)requestAnimationFrame(st);else{const ev=new Event('submit',{cancelable:true,bubbles:true});ev.detail_done=1;document.getElementById('bform').dispatchEvent(ev)}};requestAnimationFrame(st);return}
